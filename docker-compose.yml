services:
  app:
    build: .
    container_name: jpage
    ports:
      - "8858:8858"
    volumes:
      - ./data:/app/data
    environment:
      - NODE_ENV=production
      - PORT=8858
      - ADMIN_USER=${ADMIN_USER:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - SESSION_SECRET=${SESSION_SECRET:-}
    restart: unless-stopped
